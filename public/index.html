<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=my-2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/favicon-32.png?v=my-2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/brand-mark.svg?v=my-2" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090f1c" />
    <meta
      name="description"
      content="Mustafa Yücel — Senior Full Stack Engineer. .NET, Node.js, React, Angular ve Flutter ile kurumsal yazılımlar, web ve mobil uygulamalar."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" sizes="180x180" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Mustafa Yücel | Senior Full Stack Engineer</title>
    <script>
      (function(l) {
        if (l.pathname === '/my-portfolio' || l.pathname.indexOf('/my-portfolio/') === 0) {
          var oldPath = l.pathname.replace(/^\/my-portfolio\/?/, '/');
          var oldSearch = l.search[1] === '/' ? '' : l.search;
          window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + oldPath + oldSearch + l.hash);
          return;
        }

        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');

          if (decoded === '/my-portfolio' || decoded.indexOf('/my-portfolio/') === 0) {
            window.location.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + decoded.replace(/^\/my-portfolio\/?/, '/') + l.hash);
            return;
          }

          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>

    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
